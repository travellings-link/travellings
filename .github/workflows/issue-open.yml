# Issue 创建时自动标记“待处理”标签

name: 【Open】Label and move to project on issue open
on:
  issues:
    types: [opened]

jobs:
  label-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Label issue
        uses: andymckay/labeler@master
        with:
          add-labels: "待处理"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log if feedback label exists
        uses: actions/github-script@v4
        with:
          script: |
            const labels = context.payload.issue.labels.map(label => label.name);
            if (labels.includes('反馈')) {
              console.log('issue是反馈，跳过后续网站检测和评论。');
            }

  auto-check-assistant:
    # 如果包含“反馈”标签，则跳过整个 job
    if: ${{ !contains(github.event.issue.labels.*.name, '反馈') }}
    strategy:
      fail-fast: false
      max-parallel: 3
    # 不设 defaults.run.working-directory：本 job 的 run 步骤有的在仓库根
    # （下载二进制）、有的要读写 travellings-bot/ 下的文件，统一用显式路径，
    # 免得相对目录叠成双层（曾经踩过 ./travellings-bot/travellings-bot/）。
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.gen_output.outputs.result }}
    permissions:
      issues: read
    steps:
      # 用 travellings-autocheck 的 Go 版巡检（bot ci），不再检出 Node 版
      # travellings-bot 跑 pnpm。下载地址固定写 latest——本仓的滚动发版语义就是
      # 让 CI 永远用最新巡检逻辑，避免 workflow 里再维护一份版本号。
      - name: Download autocheck bot (latest)
        run: |
          mkdir -p ./travellings-bot
          curl -fsSL -o ./travellings-bot/bot \
            https://github.com/travellings-link/travellings-autocheck/releases/latest/download/bot-linux-amd64
          chmod +x ./travellings-bot/bot
          ./travellings-bot/bot --version

      - name: Read Issue Content
        uses: actions/github-script@v4
        with:
          script: |
            async function getWebsiteURL(context, github) {
              const issue = context.issue;

              const issueResponse = await github.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });
              const issueBody = issueResponse.data.body;
              const lines = issueBody.split('\n');
              let websiteUrl = '';

              // 新申请拿到网址
              for (let i = 0; i < lines.length; i++) {
                if (lines[i].trim() === '### 网站网址') {
                  websiteUrl = lines[i + 2].trim();
                  break;
                }
              }

              // 申请更改的拿到网址
              if (websiteUrl === '') {
                for (let i = 0; i < lines.length; i++) {
                  if (lines[i].trim() === '### 新网址（不更改网址请留空）') {
                    websiteUrl = lines[i + 2].trim();
                    break;
                  }
                }
              }

              // 申请更改类，但是不改网址的
              if (websiteUrl === '_No response_') {
                for (let i = 0; i < lines.length; i++) {
                  if (lines[i].trim() === '### 原网址') {
                    websiteUrl = lines[i + 2].trim();
                    break;
                  }
                }
              }
              
              // 还是没拿到网址啥的就退出
              if (websiteUrl === '_No response_' | websiteUrl === '' ) {
                // core.setFailed('未能获取到有效的网址');
                return;
              }

              return websiteUrl;
            }

            const websiteUrl = await getWebsiteURL(context, github);

            const fs = require('fs');

            if (websiteUrl === undefined){
              console.log('未能获取到有效的网址');
              fs.writeFileSync('./travellings-bot/url.txt', "");
              return;
            }
            console.log('Website URL:', websiteUrl);
            fs.writeFileSync('./travellings-bot/url.txt', websiteUrl);
      # 浏览器用 runner 自带的 Chrome（ubuntu-latest 镜像自带 google-chrome），
      # 不再 npx puppeteer 下载一份。bot 连不上 --cdp-url 时会自动回退到自启
      # 本地无头 Chrome，正好走这个。
      - name: Run bot ci
        run: |
          websiteUrl=$(head -n 1 ./travellings-bot/url.txt)

          if [ -z "$websiteUrl" ]; then
            echo "Website URL is empty, skipping bot ci."
            exit 0
          fi

          # 直接落成 results.json：后面 Comment 步骤读的就是这个路径与结构。
          ./travellings-bot/bot ci "$websiteUrl" > ./travellings-bot/results.json
      # - name: ls
      #   run: ls
      - name: Comment on issue
        uses: actions/github-script@v4
        with:
          script: | 
            const fs = require('fs');

            if (!fs.existsSync('./travellings-bot/results.json')) {
              console.log('results.json file does not exist, skipping comment.');
              core.exportVariable('last_result', "null");
              return;
            }

            const json_result = JSON.parse(fs.readFileSync('./travellings-bot/results.json', { encoding: 'utf8' }));

            console.log(JSON.stringify(json_result, null, 2));

            core.exportVariable('last_result', json_result);

      - name: Generate output
        id: gen_output
        run: |
          echo ${last_result}
          echo "result=${last_result}" >> "$GITHUB_OUTPUT"

  comment-auto-check-assistant-result:
    # 如果包含“反馈”标签，则跳过整个 job
    if: ${{ !contains(github.event.issue.labels.*.name, '反馈') }}
    runs-on: ubuntu-latest
    needs: [auto-check-assistant]
    steps:
      - name: Comment on issue
        uses: actions/github-script@v4
        env:
          RESULT: ${{ needs.auto-check-assistant.outputs.result }}
        with:
          script: |
            async function getWebsiteURL(context, github) {
              const issue = context.issue;
              const issueResponse = await github.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });
              const issueBody = issueResponse.data.body;
              const lines = issueBody.split('\n');
              let websiteUrl = '';

              // 新申请拿到网址
              for (let i = 0; i < lines.length; i++) {
                if (lines[i].trim() === '### 网站网址') {
                  websiteUrl = lines[i + 2].trim();
                  break;
                }
              }

              // 申请更改的拿到网址
              if (websiteUrl === '') {
                for (let i = 0; i < lines.length; i++) {
                  if (lines[i].trim() === '### 新网址（不更改网址请留空）') {
                    websiteUrl = lines[i + 2].trim();
                    break;
                  }
                }
              }

              // 申请更改类，但是不改网址的
              if (websiteUrl === '_No response_') {
                for (let i = 0; i < lines.length; i++) {
                  if (lines[i].trim() === '### 原网址') {
                    websiteUrl = lines[i + 2].trim();
                    break;
                  }
                }
              }
              
              // 还是没拿到网址啥的就退出
              if (websiteUrl === '_No response_' | websiteUrl === '' ) {
                // core.setFailed('未能获取到有效的网址');
                return;
              }

              return websiteUrl;
            }

            const websiteUrl = await getWebsiteURL(context, github);

            if (websiteUrl === undefined){
              console.log('未能获取到有效的网址');
              // 此时 process.env.RESULT 为 null
              const issue = context.issue;
              const label = context.payload.label;
              github.issues.createComment({
                issue_number: issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "站点信息自动检查失败❌\n未能获取到有效的网址"
              });
              return;
            }

            let json_result = JSON.parse(process.env.RESULT)["results"][websiteUrl];

            // console.log(json_result);

            function replaceNodeValue(json_result){
              for (const key in json_result) {
                if (typeof json_result[key] === 'object') {
                  replaceNodeValue(json_result[key]);
                } else if (json_result[key] === "RUN") {
                json_result[key] = '✅RUN';
                } else if (json_result[key] === "SKIP") {
                  // 没跑这一腿，不是失败。用中性符号，别打 ❌ 让人以为验过且没过。
                  json_result[key] = '⬜SKIP（未执行）';
                } else if (key === "status") {
                  json_result[key] = '❌' + json_result[key];
                }
              }
            }

            replaceNodeValue(json_result);

            let result = `站点信息自动检查完毕🎉  
            自动检查结果：  
            - HTTP 请求检查：${json_result["axiosCheck"]["status"]}${json_result["axiosCheck"]["status"] === '✅RUN' ? '' : '、失败原因：' + json_result["axiosCheck"]["failedReason"] }
            - 浏览器模拟检查：${json_result["browserCheck"]["status"]}
            本检测仅为参考，最终结果以人工审核为准。
            <details><summary>原始返回值 点击查看详情</summary>
            ${JSON.stringify(json_result, null, 2)}
            </details>`;

            const issue = context.issue;
            const label = context.payload.label;
            github.issues.createComment({
              issue_number: issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: result
            });