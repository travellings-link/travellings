name: Comment automatically when labeled

on:
  issues:
    types: [labeled]

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on issue
        uses: actions/github-script@v4
        with:
          script: |
            const issue = context.issue;
            const label = context.payload.label;
            // 定义一个通用的 response function
            function autoResponse(body) {
              github.issues.createComment({
                issue_number: issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              })
            }
            if (label.name === "审核通过") {
                autoResponse(`您的申请已通过，欢迎加入开往大家庭～
                待机器人自动关闭当前 Issue 后，您便可以在[开往成员列表](https://list.travellings.cn)搜索到您的网站~
                开往的 QQ 群：186690715，开往的 Telegram 群：[TravellingsCN](https://t.me/TravellingsCN)`);
            } else if (label.name === "需要免责声明") {
                autoResponse(`站长您好，根据开往规则修改 #2433，您需要对您使用在 Public Suffix List 的免费二级域名进行eTLD免责声明。
                以下为声明模板，您需要修改相关信息后发布在这个 issue 下方：
                
                我已确认我使用的免费域名 [你的域名] 存在于 Public Suffix List 内，我已知悉开往规则中对于免费二级域名所要求的内容。已知悉开往维护组在遇到以下情况时可能会执行先撤销后通知：
                多次巡查发现网站为 404 状态
                超过一年未更新文章
                人工巡查发现网站样式错误
                网站包含黄色类、赌博类、暴力类、政治类、恐怖类等内容
                我承诺我的网站不会发生以上阐述的内容，在发生已执行先撤销后通知之后，我将对此处理不会有任何异议。
                
                [您的GitHub用户名+网站域名]
                [日期]`);
            } else if (label.name === "信息更改完成") {
                autoResponse(`您申请的站点信息更改已经完成啦～
                请查看[开往成员列表](https://list.travellings.cn/)
                若信息更改前站点状态异常，请等待下一次巡查。
                开往的 QQ 群：186690715，开往的 Telegram 群：[TravellingsCN](https://t.me/TravellingsCN)`);

                // 关闭此 issue
                github.issues.update({
                    issue_number: issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: "closed"
                });
            } else if (label.name === "超时") {
                autoResponse(`此 Issue 已被标记为超时，我们将锁定这个对话。如您后续希望继续申请，可以重新提交 Issue 再次申请。感谢您对 开往-友链接力 的支持！`);

                // 关闭此 issue
                github.issues.update({
                    issue_number: issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: "closed"
                });

                // 锁定此 issue
                github.issues.lock({
                  issue_number: issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo
                });
            }

  add-to-list:
    if: github.event.label.name == '审核通过'
    runs-on: ubuntu-latest
    steps:
      - name: Add site to list
        uses: actions/github-script@v7
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: https://api.travellings.cn
        with:
          script: |
            const body = context.payload.issue.body || '';
            const lines = body.split('\n');
            const field = (title) => {
              const i = lines.findIndex((l) => l.trim() === title);
              return i === -1 ? '' : (lines[i + 2] || '').trim();
            };

            const name = field('### 网站名称');
            const link = field('### 网站网址');

            if (!name || !link || name === '_No response_' || link === '_No response_') {
              core.setFailed(`未能从 Issue 解析出名称/网址：name="${name}" link="${link}"`);
              return;
            }

            const ALPHABET = '0123456789abcdefghjkmnpqrtuvwxyz';
            const base32Encode = (input) => {
              let bits = 0, value = 0, out = '';
              for (let i = 0; i < input.length; i++) {
                value = (value << 8) | input.charCodeAt(i);
                bits += 8;
                while (bits >= 5) {
                  out += ALPHABET[(value >>> (bits - 5)) & 31];
                  bits -= 5;
                }
              }
              if (bits > 0) out += ALPHABET[(value << (5 - bits)) & 31];
              return out;
            };

            const res = await fetch(`${process.env.API_BASE}/action/add`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Cookie: `_tlogin=${base32Encode(process.env.ADMIN_TOKEN)}`,
              },
              body: JSON.stringify([{ name, link, issuesId: context.issue.number }]),
            });

            const data = await res.json();
            core.info(JSON.stringify(data));

            if (data.success) {
              core.info(`已入库：${name} <${link}>`);
              return;
            }

            if (typeof data.msg === 'string' && data.msg.includes('已经在数据库中了')) {
              core.warning(`${link} 已在列表中，跳过`);
              return;
            }

            core.setFailed(`入库失败：${data.msg || res.status}`);
