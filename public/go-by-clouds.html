<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>开往 - 友链接力</title>
    <meta name="title" content="开往 - 友链接力" />

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron&family=Roboto+Mono&display=swap"
        rel="stylesheet"
    />

    <link rel="icon" href="./assets/favicon.png" />

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;

            background: #87bde8;
            font-family: Orbitron, sans-serif;
        }

        body {
            opacity: 0;
            transition: opacity 1s ease;
        }

        #content {
            position: fixed;
            top: 56%;
            left: 50%;
            z-index: 10;

            transform: translate(-50%, -50%);

            width: min(90vw, 1200px);

            text-align: center;
            color: #050826cf;
            font-size: clamp(15px, 2vw, 50px);

            opacity: 0;
            transition: opacity 1s ease;

            user-select: none;
        }

        #arrive {
            margin-top: 0.15em;
        }

        .botCenter {
            position: fixed;
            left: 0;
            bottom: 10px;
            z-index: 10;

            width: 100%;

            line-height: 20px;
            font-size: 12px;
            text-align: center;

            color: #000000cf;
            font-family: "Roboto Mono", monospace;
        }

        a {
            color: #000000cf;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #0056b3;
        }

        a:active {
            color: #ff0000;
        }
    </style>
</head>

<body>

    <main id="content" lang="en">
        <div>TRAVELLING INTO ANOTHER SPACE</div>

        <div id="arrive" aria-live="polite">
            WE WILL ARRIVE IN
            <span id="count"></span>s
        </div>
    </main>

    <footer class="botCenter">
        ↩️ Tips:
        <b>后退</b>网页可再次开往
        |
        <a href="./preference">
            ⚙️ 开往偏好设置
        </a>
        |
        <a
            href="https://www.travellings.cn/docs/join"
            target="_blank"
            rel="noopener noreferrer"
        >
            🚇 加入
        </a>
    </footer>

    <script src="https://unpkg.com/three@0.110.0/build/three.min.js"></script>
    <script src="https://unpkg.com/vanta@0.5.21/dist/vanta.clouds.min.js"></script>
    <script src="https://unpkg.com/gsap@3.9.1/dist/gsap.min.js"></script>

    <script>
        const STORAGE_PREFIX = "t_preference_";
        const DEFAULT_TIMEOUT = 5000;

        const getSetting = (key) =>
            localStorage.getItem(STORAGE_PREFIX + key);

        const contentElement =
            document.getElementById("content");

        const arriveElement =
            document.getElementById("arrive");

        const countElement =
            document.getElementById("count");

        const preferredTag =
            getSetting("tag");

        const timeoutSetting =
            Number(getSetting("timeout"));

        const travellingTimeout =
            Number.isFinite(timeoutSetting) && timeoutSetting > 0
                ? timeoutSetting
                : DEFAULT_TIMEOUT;

        let cloudsEffect = null;

        /*
         * Initialize Vanta Clouds.
         *
         * The page can still redirect even if Vanta fails to load.
         */
        function initClouds() {
            if (
                typeof VANTA === "undefined" ||
                typeof VANTA.CLOUDS !== "function"
            ) {
                console.warn(
                    "Vanta Clouds is unavailable. Using fallback background."
                );
                return;
            }

            try {
                cloudsEffect = VANTA.CLOUDS({
                    el: document.body,
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.0,
                    minWidth: 200.0
                });
            } catch (error) {
                console.error(
                    "Failed to initialize Vanta Clouds:",
                    error
                );
            }
        }

        /*
         * Animate cloud speed when possible.
         */
        function setCloudSpeed(value) {
            if (
                !cloudsEffect ||
                !cloudsEffect.uniforms ||
                !cloudsEffect.uniforms.speed
            ) {
                return;
            }

            if (typeof gsap !== "undefined") {
                gsap.to(
                    cloudsEffect.uniforms.speed,
                    {
                        value,
                        duration: 20,
                        ease: "linear"
                    }
                );
            } else {
                cloudsEffect.uniforms.speed.value = value;
            }
        }

        /*
         * Request a random Travellings destination.
         */
        async function goTravelling() {
            let apiUrl =
                "https://api.travellings.cn/random";

            if (preferredTag) {
                apiUrl +=
                    "?tag=" +
                    encodeURIComponent(preferredTag);
            }

            try {
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }

                const result = await response.json();

                const destination =
                    result?.data?.[0]?.url;

                if (!result?.success || !destination) {
                    throw new Error(
                        "Unexpected API response"
                    );
                }

                window.location.href = destination;
            } catch (error) {
                console.error(
                    "Travelling request failed:",
                    error
                );

                setCloudSpeed(0.6);

                arriveElement.innerHTML =
                    "CONNECTION FAILED<br>" +
                    "<span style=\"font-family:'Roboto Mono', monospace;" +
                    "font-size:0.5em;\">" +
                    "Please try again later." +
                    "</span>";
            }
        }

        /*
         * Countdown.
         */
        function startCountdown() {
            let count =
                Math.max(
                    1,
                    Math.ceil(travellingTimeout / 1000)
                );

            countElement.textContent = count;

            const timer = setInterval(() => {
                count--;

                if (count > 0) {
                    countElement.textContent = count;
                }

                if (count === 3) {
                    setCloudSpeed(1.1);
                }

                if (count === 1) {
                    setCloudSpeed(1.4);
                }

                if (count <= 0) {
                    clearInterval(timer);

                    arriveElement.textContent =
                        "CONNECTING...";

                    setCloudSpeed(1.6);

                    goTravelling();
                }
            }, 1000);
        }

        /*
         * Page entrance.
         */
        function startPage() {
            initClouds();

            requestAnimationFrame(() => {
                document.body.style.opacity = "1";

                setTimeout(() => {
                    contentElement.style.opacity = "1";
                }, 600);
            });

            startCountdown();
        }

        window.addEventListener(
            "DOMContentLoaded",
            startPage
        );
    </script>

</body>

</html>
