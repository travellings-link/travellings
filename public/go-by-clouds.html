<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>开往 - 友链接力</title>
    <meta name="title" content="开往 - 友链接力" />

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron&family=Roboto+Mono&display=swap"
        rel="stylesheet"
    />

    <link rel="icon" href="./assets/favicon.png" />

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;

            background: #87bde8;
            font-family: Orbitron, sans-serif;
        }

        body {
            opacity: 0;
            transition: opacity 1s ease;
        }

        #content {
            position: fixed;
            top: 56%;
            left: 50%;
            z-index: 10;

            transform: translate(-50%, -50%);

            width: min(90vw, 1200px);

            text-align: center;
            color: #050826cf;
            font-size: clamp(15px, 2vw, 50px);

            opacity: 0;
            transition: opacity 1s ease;

            user-select: none;
        }

        #arrive {
            margin-top: 0.15em;
        }

        .status-detail {
            font-family: "Roboto Mono", monospace;
            font-size: 0.5em;
        }

        .botCenter {
            position: fixed;
            left: 0;
            bottom: 10px;
            z-index: 10;

            width: 100%;

            line-height: 20px;
            font-size: 12px;
            text-align: center;

            color: #000000cf;
            font-family: "Roboto Mono", monospace;
        }

        a {
            color: #000000cf;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #0056b3;
        }

        a:active {
            color: #ff0000;
        }
    </style>
</head>

<body>

    <main id="content" lang="en">
        <div>TRAVELLING INTO ANOTHER SPACE</div>

        <div id="arrive" aria-live="polite">
            WE WILL ARRIVE IN
            <span id="count"></span>s
        </div>
    </main>

    <footer class="botCenter">
        ↩️ Tips:
        <b>后退</b>网页可再次开往
        |
        <a href="./preference">
            ⚙️ 开往偏好设置
        </a>
        |
        <a
            href="https://www.travellings.cn/docs/join"
            target="_blank"
            rel="noopener noreferrer"
        >
            🚇 加入
        </a>
    </footer>

    <script src="https://unpkg.com/three@0.110.0/build/three.min.js"></script>
    <script src="https://unpkg.com/vanta@0.5.21/dist/vanta.clouds.min.js"></script>
    <script src="https://unpkg.com/gsap@3.9.1/dist/gsap.min.js"></script>

    <script>
        const STORAGE_PREFIX = "t_preference_";
        const DEFAULT_TIMEOUT = 5000;
        const REQUEST_TIMEOUT = 5000;

        const PRIMARY_API =
            "https://api.travellings.cn/random";

        const BACKUP_API =
            "https://backup.api.travellings.cn/list.json";

        const getSetting = (key) =>
            localStorage.getItem(STORAGE_PREFIX + key);

        const contentElement =
            document.getElementById("content");

        const arriveElement =
            document.getElementById("arrive");

        const countElement =
            document.getElementById("count");

        const preferredTag =
            getSetting("tag");

        const timeoutSetting =
            Number(getSetting("timeout"));

        const travellingTimeout =
            Number.isFinite(timeoutSetting) &&
            timeoutSetting > 0
                ? timeoutSetting
                : DEFAULT_TIMEOUT;

        let cloudsEffect = null;

        /*
         * Initialize Vanta Clouds.
         *
         * Redirect functionality remains available even if
         * the visual effect fails to load.
         */
        function initClouds() {
            if (
                typeof VANTA === "undefined" ||
                typeof VANTA.CLOUDS !== "function"
            ) {
                console.warn(
                    "Vanta Clouds is unavailable. Using fallback background."
                );
                return;
            }

            try {
                cloudsEffect = VANTA.CLOUDS({
                    el: document.body,
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.0,
                    minWidth: 200.0
                });
            } catch (error) {
                console.error(
                    "Failed to initialize Vanta Clouds:",
                    error
                );
            }
        }

        /*
         * Change the cloud animation speed when possible.
         */
        function setCloudSpeed(value) {
            if (
                !cloudsEffect ||
                !cloudsEffect.uniforms ||
                !cloudsEffect.uniforms.speed
            ) {
                return;
            }

            if (typeof gsap !== "undefined") {
                gsap.to(
                    cloudsEffect.uniforms.speed,
                    {
                        value,
                        duration: 20,
                        ease: "linear"
                    }
                );
            } else {
                cloudsEffect.uniforms.speed.value =
                    value;
            }
        }

        /*
         * Fetch with a timeout.
         */
        async function fetchWithTimeout(
            url,
            timeoutMs
        ) {
            const controller =
                new AbortController();

            const timeoutId =
                setTimeout(
                    () => controller.abort(),
                    timeoutMs
                );

            try {
                return await fetch(
                    url,
                    {
                        signal: controller.signal
                    }
                );
            } finally {
                clearTimeout(timeoutId);
            }
        }

        /*
         * Show the final failure state.
         */
        function showConnectionFailure() {
            setCloudSpeed(0.6);

            arriveElement.replaceChildren(
                document.createTextNode(
                    "CONNECTION FAILED"
                ),
                document.createElement("br"),
                Object.assign(
                    document.createElement("span"),
                    {
                        className: "status-detail",
                        textContent:
                            "Please try again later."
                    }
                )
            );
        }

        /*
         * Request a destination from the primary API.
         */
        async function getPrimaryDestination() {
            let apiUrl = PRIMARY_API;

            if (preferredTag) {
                apiUrl +=
                    "?tag=" +
                    encodeURIComponent(
                        preferredTag
                    );
            }

            const response =
                await fetchWithTimeout(
                    apiUrl,
                    REQUEST_TIMEOUT
                );

            if (!response.ok) {
                throw new Error(
                    `Primary API HTTP ${response.status}`
                );
            }

            const result =
                await response.json();

            const destination =
                result?.data?.[0]?.url;

            if (
                !result?.success ||
                !destination
            ) {
                throw new Error(
                    "Unexpected primary API response"
                );
            }

            return destination;
        }

        /*
         * Request a destination from the official backup list.
         */
        async function getBackupDestination() {
            const response =
                await fetchWithTimeout(
                    BACKUP_API,
                    REQUEST_TIMEOUT
                );

            if (!response.ok) {
                throw new Error(
                    `Backup API HTTP ${response.status}`
                );
            }

            const result =
                await response.json();

            const list =
                result?.data;

            if (
                !Array.isArray(list) ||
                list.length === 0
            ) {
                throw new Error(
                    "Unexpected backup API response"
                );
            }

            const randomIndex =
                Math.floor(
                    Math.random() *
                    list.length
                );

            const destination =
                list[randomIndex]?.url;

            if (!destination) {
                throw new Error(
                    "Invalid backup destination"
                );
            }

            return destination;
        }

        /*
         * Begin travelling.
         *
         * Primary API
         *      ↓ failure
         * Official backup list
         *      ↓ failure
         * CONNECTION FAILED
         */
        async function goTravelling() {
            try {
                const destination =
                    await getPrimaryDestination();

                window.location.href =
                    destination;

                return;
            } catch (primaryError) {
                console.warn(
                    "Primary Travellings API failed. Using backup:",
                    primaryError
                );
            }

            try {
                const destination =
                    await getBackupDestination();

                window.location.href =
                    destination;
            } catch (backupError) {
                console.error(
                    "Travellings backup also failed:",
                    backupError
                );

                showConnectionFailure();
            }
        }

        /*
         * Countdown.
         */
        function startCountdown() {
            let count =
                Math.max(
                    1,
                    Math.ceil(
                        travellingTimeout / 1000
                    )
                );

            countElement.textContent =
                count;

            const timer =
                setInterval(() => {
                    count--;

                    if (count > 0) {
                        countElement.textContent =
                            count;
                    }

                    if (count === 3) {
                        setCloudSpeed(1.1);
                    }

                    if (count === 1) {
                        setCloudSpeed(1.4);
                    }

                    if (count <= 0) {
                        clearInterval(timer);

                        arriveElement.textContent =
                            "CONNECTING...";

                        setCloudSpeed(1.6);

                        goTravelling();
                    }
                }, 1000);
        }

        /*
         * Page entrance.
         */
        function startPage() {
            initClouds();

            requestAnimationFrame(() => {
                document.body.style.opacity =
                    "1";

                setTimeout(() => {
                    contentElement.style.opacity =
                        "1";
                }, 600);
            });

            startCountdown();
        }

        window.addEventListener(
            "DOMContentLoaded",
            startPage
        );
    </script>

</body>

</html>
